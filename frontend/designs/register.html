<script>
        // Micro-interactions for form inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.add('text-primary-container');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.remove('text-primary-container');
            });
        });

        // Simple button ripple-like effect
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.opacity = '0.8';
            });
            button.addEventListener('mouseup', () => {
                button.style.opacity = '1';
            });
        });
    </script>
